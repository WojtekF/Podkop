<mat-card [class]="{ comment: true, thread: !isReply() }">
  <mat-card-content>
    <div class="header">
      <div class="meta">
        <div class="author">{{ comment().author }}</div>
        <div class="age">{{ comment().createdAt | timeAgo }}</div>
      </div>
      <div class="counts">
        <button
          [class]="{ 'upvote-button': true, voted: comment().myVote === 'up' }"
          mat-icon-button
          aria-label="Vote up"
          [disabled]="isButtonDisabled()"
          (click)="vote.emit('up')"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>
        <span class="upvote-count">{{ comment().upvoteCount }}</span>
        <span class="downvote-count">{{ comment().downvoteCount }}</span>
        <button
          [class]="{ 'downvote-button': true, voted: comment().myVote === 'down' }"
          mat-icon-button
          aria-label="Vote down"
          [disabled]="isButtonDisabled()"
          (click)="vote.emit('down')"
        >
          <mat-icon>arrow_downward</mat-icon>
        </button>
      </div>
    </div>
    <div class="text">{{ comment().text }}</div>
    <div class="comment-row-actions">
      <button mat-button class="reply-button" (click)="reply.emit()">Reply</button>
      @if (isActionMenuVisible()) {
        <button
          class="comment-menu-button"
          matIconButton
          [matMenuTriggerFor]="menu"
          aria-label="Comment actions"
        >
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu>
          <button
            class="report-menu-item"
            mat-menu-item
            [disabled]="reportedByMe()"
            (click)="report.emit()"
          >
            {{ reportedByMe() ? 'Reported' : 'Report' }}
          </button>
        </mat-menu>
      }
    </div>
    <!--
      Issue #33 — the comment report action (the colocated specs define done):
      - Every comment authored by someone else carries an overflow (kebab) menu, opened by a
        "button.comment-menu-button" with aria-label "Comment actions". The reader's own
        comments show no such button at all — self-reports are refused, and with Report the
        menu's only entry, an empty menu has nothing to offer.
      - The opened menu holds one "button.report-menu-item". While this comment is not yet
        reported it reads "Report" and is enabled; choosing it emits the `report` output.
      - When `reportedByMe` is true the item reads "Reported" and is disabled; nothing emits.
    -->
  </mat-card-content>
</mat-card>
