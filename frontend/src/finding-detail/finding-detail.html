<!--
  Finding detail — read-only view of a single finding. The template renders exactly ONE of
  four states, chosen from the detail store's status. The class hooks and copy below are what
  the colocated finding-detail.spec.ts asserts; how you structure and render them is yours
  to choose.

  LOADED (status 'loaded' — the store holds the finding):
    The finding shown in full:
      - the title, marked `title` — plain text, not a link (per Wykop, the title never leads
        to the Source).
      - the Source domain, marked `domain`, as a link to the finding's Source marked
        `source-link`, opening in a new tab with the same safe link attributes the finding
        card uses. Only this domain link leads to the Source.
      - the full, untruncated description, marked `description`.
      - the author, marked `author`.
      - every tag, each marked `tag`, shown as `#` followed by the tag (e.g. `#angular`).
      - the thumbnail when the finding has one: an image element marked `thumbnail` whose
        source is the finding's thumbnail URL. When it has none, render a neutral placeholder
        of the same shape, marked `thumbnail thumbnail-placeholder` — never an empty image.
      - both timestamps shown human-readably: the creation time marked `created-at` and the
        promotion time marked `promoted-at`.
      (No vote controls and no comments yet — those arrive in later tickets. A `#comments`
      landing target for the card's comment-count link also arrives with the comments ticket.)

  ERROR (status 'error' — any other load failure):
    A container carrying the classes `detail-state error` whose text includes exactly
    `Couldn't load the finding.`, plus a control marked `retry-button` that re-requests the
    finding (the component exposes retry() for this).
-->
@if (store.status() === 'loading') {
  <div class="detail-state loading">
    <mat-spinner />
  </div>
} @else if (store.status() === 'notFound') {
  <div class="detail-state not-found">
    Finding not found.
    <a routerLink="/" class="back-link">Main Page</a>
  </div>
} @else if (store.status() === 'error') {
  <div class="detail-state error">
    Couldn't load the finding.
    <button matButton="outlined" class="retry-button" (click)="retry()">Retry</button>
  </div>
}
