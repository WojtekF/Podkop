<!--
  The report dialog (issue #32). The colocated report-dialog.spec.ts asserts this behaviour.
  Bind against the `status`, `points`, `selectedPointId`, and `note` signals, the `pending`
  input, the `maxNoteLength`, `isOverLimit`, and `isSubmitDisabled` members, the
  `retryStatute` and `submitReport` methods, and the `cancel` output.

  The dialog lets the member report the finding: it offers only the reportable Statute Points
  of the current Statute, the member picks exactly one, optionally adds a short note, and
  submits.

  Render, inside a container with class `report-dialog`:

  - A title, class `report-title`, reading "Report finding".

  - While the Statute is on its way: a container with classes `report-state loading`; its look
    is yours to choose.

  - When the Statute failed to load: a container with classes `report-state error` reading
    "Couldn't load the Statute.", plus a retry control, class `retry-button`, labelled
    "Retry", that triggers `retryStatute`.

  - When loaded: one selectable row per offered point, class `report-point`, showing the
    point's citation (class `point-citation`, e.g. "2.1") and its text (class `point-text`).
    Activating a row selects its point; exactly one point is selected at a time, and the
    selected row carries the class `selected`.

  - A note field — a textarea with class `report-note` — holding the optional note, labelled
    "Add a note (optional)". A character counter, class `note-counter`, visible whenever the
    points are, showing how many characters the note holds and the 500 cap. When the note is
    over the cap the counter carries the class `over-limit` so it can read as an error.

  - A submit control, class `submit-report-button`, labelled "Submit report", triggering
    `submitReport`. It is disabled exactly when `isSubmitDisabled` says so — no point picked
    yet, the note over the cap, or a filing in flight.

  - While a filing is in flight (the `pending` input): the note field is disabled too, and
    everything the member entered stays put.

  - A cancel control, class `cancel-report-button`, labelled "Cancel", emitting the `cancel`
    output.
-->
<div class="report-dialog">
  <h2 mat-dialog-title class="report-title">Report finding</h2>
  @if (status() === 'loading') {
    <mat-dialog-content class="report-state loading">
      <mat-spinner />
    </mat-dialog-content>
  } @else if (status() === 'error') {
    <mat-dialog-content class="report-state error">
      <h3>Couldn't load the Statute.</h3>
      <mat-dialog-actions align="end">
        <button mat-button class="retry-button" (click)="loadStatute()">Retry</button>
      </mat-dialog-actions>
    </mat-dialog-content>
  } @else {
    <mat-dialog-content class="report-state">
      <mat-selection-list [multiple]="false">
        @for (point of points(); track point.id) {
          <mat-list-option
            [class]="{ 'report-point': true, selected: selectedPointId() === point.id }"
            (click)="onOptionClicked(point.id)"
            [selected]="selectedPointId() === point.id"
          >
            <span class="point-citation">{{ point.citation }}</span>
            <span class="point-text">{{ point.text }}</span>
          </mat-list-option>
        }
      </mat-selection-list>
      <mat-form-field>
        <mat-label> Add a note (optional)</mat-label>
        <textarea
          #ta
          matInput
          class="report-note"
          [value]="note()"
          (input)="note.set(ta.value)"
          [disabled]="pending()"
        ></textarea>
        <mat-hint [class]="{ 'note-counter': true, 'over-limit': isOverLimit() }">
          {{ note().length }}/{{ maxNoteLength }}
        </mat-hint>
      </mat-form-field>
      <mat-dialog-actions align="end">
        <button mat-button class="cancel-report-button" (click)="cancel.emit()">Cancel</button>
        <button
          mat-button
          class="submit-report-button"
          (click)="submitReport()"
          [disabled]="isSubmitDisabled()"
        >
          Submit report
        </button>
      </mat-dialog-actions>
    </mat-dialog-content>
  }
</div>
