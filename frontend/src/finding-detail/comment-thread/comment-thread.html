<!--
  Issue #33 — report requests travel through this thread (the colocated specs define done):
  - Every row, the top-level comment and each reply alike, learns its `reportedByMe` state
    from this thread's slice of `reportedCommentIds`.
  - A row's `report` output bubbles up through this component's `report` output carrying that
    row's own comment id — a reply names itself, never its thread.
-->
<mat-card class="thread">
  <app-comment-row
    [isReply]="false"
    [comment]="thread()"
    [votePending]="pendingVoteIds().includes(thread().id)"
    (vote)="vote.emit({ commentId: thread().id, direction: $event })"
    (reply)="reply.emit({ threadId: thread().id, appendAuthor: null })"
    [reportedByMe]="reportedCommentIds().includes(thread().id)"
    (report)="report.emit(thread().id)"
  />
  <div class="replies">
    @if (composer() !== undefined) {
      <app-comment-composer
        [cancellable]="true"
        (cancel)="composerCancel.emit()"
        (post)="composerPost.emit()"
        (draftChange)="composerDraftChange.emit($event)"
        [pending]="composer()!.pending"
        [draft]="composer()!.draft"
      />
    }
    @for (replyComment of thread().replies; track replyComment.id) {
      <app-comment-row
        [comment]="replyComment"
        [votePending]="pendingVoteIds().includes(replyComment.id)"
        (vote)="vote.emit({ commentId: replyComment.id, direction: $event })"
        (reply)="reply.emit({ threadId: thread().id, appendAuthor: replyComment.author })"
        [reportedByMe]="reportedCommentIds().includes(replyComment.id)"
        (report)="report.emit(replyComment.id)"
      />
    }
  </div>
</mat-card>
