  tickets. Landing on the page triggers the store's one load. States the colocated specs
  assert:

  - Loading (store status 'loading'): a `.queue-state.loading` block.
  - Error (store status 'error', the moderators-only refusal included): a `.queue-state.error`
    block reading "Couldn't load the case queue."
  - Loaded with no cases: a `.queue-empty` block reading "No open cases."
  - Loaded: one `.case-card` per case, in the exact order served — the server owns the
    oldest-grievance-first order; never re-sort. Each card shows:
      - `.case-preview` — a link carrying the case's preview text, leading to the finding page
        (`/finding/<findingId>`) — for a comment case that is the finding the comment lives on;
      - `.case-author` — the content's author;
      - `.case-report-count` — the number of pending reports;
      - one `.report-row` per report, in the exact order served (oldest first), showing
        `.report-point-citation` (e.g. "2.1") and `.report-point-text` — the cited point as the
        report's pinned Statute version worded it — `.report-filed-at` with when it was filed,
        and `.report-note` with the reporter's note, present only on a report that carries one.
        Reporter identities are never shown.
