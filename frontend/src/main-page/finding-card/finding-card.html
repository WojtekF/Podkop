<!--
  FindingCard template — write the markup yourself. The colocated specs
  (finding-card.spec.ts) are the contract; they query these hooks:

  - a.source-link            anchor around the title: [href]="finding().sourceUrl",
                             target="_blank", rel="noopener noreferrer"
  - .domain                  the source's domain, shown beside the title
  - a description paragraph  {{ finding().description }}
  - .meta                    footer with author · promotedAt · "N comments" · #tags;
                             format the date with the date pipe:
                             {{ finding().promotedAt | date: 'medium' }}
                             (needs DatePipe in the component's `imports`)
  - .dig-button              the Dig button — no Bury on Main Page cards;
                             (click) should call onDig()
  - .dig-count               the dig count next to the button
  - img.thumbnail            shown when hasThumbnail(): [src]="finding().thumbnailUrl"
  - .thumbnail-placeholder   shown otherwise: a neutral grey box with the same
                             dimensions, so every card keeps the same shape

  Angular syntax you'll need:
  - read a signal input with parentheses: {{ finding().title }}
  - control flow:  @if (cond) { ... } @else { ... }
                   @for (tag of finding().tags; track tag) { ... }
  - Angular Material (add each module to `imports` in finding-card.ts):
    <mat-card>, <mat-card-content>            — MatCardModule
    <button mat-stroked-button ...>           — MatButtonModule
    <mat-icon>keyboard_double_arrow_up</mat-icon> — MatIconModule
-->
