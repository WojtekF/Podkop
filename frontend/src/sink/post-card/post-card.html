<mat-card class="post-card">
  <mat-card-content class="post-card-content">
    <div class="vote">
      <button mat-icon-button aria-label="Upvote" (click)="upvote.emit()">
        <mat-icon>thumb_up</mat-icon>
      </button>
      <span class="vote-count">{{ mainPost().upvoteCount }}</span>
      <button mat-icon-button aria-label="Downvote" (click)="downvote.emit()">
        <mat-icon>thumb_down</mat-icon>
      </button>
    </div>
    <div class="post-body">
      <h3>
        {{ mainPost().title }}
      </h3>
      <div class="content">
        {{ mainPost().content }}
      </div>
      <span>
        {{ mainPost().author }} &middot; {{ mainPost().domain }} &middot;
        {{ mainPost().createdAt | date: 'medium' }}
      </span>
      <div class="tags"></div>

      <span class="stats">
        &middot; {{ mainPost().commentCount }} *
        @for (tag of mainPost().tags; track tag) {
          <span class="tag">#{{ tag }} </span>
        }
      </span>
    </div>
    <img matCardImage [src]="mainPost().image" />
  </mat-card-content>
</mat-card>
